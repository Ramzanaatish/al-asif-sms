name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-v2-${{ runner.os }}-${{ hashFiles('al-asif-sms/app/pubspec.yaml') }}
          restore-keys: pub-v2-${{ runner.os }}-

      - name: Install dependencies
        working-directory: al-asif-sms/app
        run: flutter pub get

      - name: Analyze
        working-directory: al-asif-sms/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: al-asif-sms/app
        run: flutter test

      - name: Build release Windows app
        working-directory: al-asif-sms/app
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: alasif-windows
          path: al-asif-sms/app/build/windows/x64/runner/Release
