name: alasif_sms
description: Al-Asif Public Middle School Management System (Android & Windows).
publish_to: 'none'
version: 1.3.4+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Networking / state / storage
  http: '>=1.2.0 <2.0.0'
  provider: '>=6.1.0 <7.0.0'
  # Let pub resolve a matching shared_preferences_android automatically
  # (a manual pin caused a NoSuchMethodError in SharedPreferencesApiRegistrar.getAll).
  shared_preferences: '>=2.5.3 <3.0.0'
  intl: '>=0.18.0 <0.21.0'
  # Offline-first: local SQLite database, connectivity monitoring,
  # SHA-256 for offline credential check.
  sqflite: '>=2.3.0 <3.0.0'
  # Desktop (Windows/macOS/Linux): sqflite has no desktop implementation,
  # so the same sqflite API runs on FFI instead (see lib/services/db_factory.dart).
  # sqlite3_flutter_libs bundles the native sqlite3 library for Windows.
  sqflite_common_ffi: '>=2.3.0 <3.0.0'
  sqlite3_flutter_libs: '>=0.5.0 <1.0.0'
  # Current app version, shown in Settings and used by the update check.
  package_info_plus: '>=8.0.0 <9.0.0'
  path: '>=1.9.0 <2.0.0'
  connectivity_plus: '>=6.0.0 <7.0.0'
  crypto: '>=3.0.0 <4.0.0'
  # Backup/restore: zip (.alasif) packing, file picking, external storage paths.
  archive: '>=3.4.0 <4.0.0'
  file_picker: '>=8.0.0 <9.0.0'
  # CSV backup export/import (one CSV file per table, inside a zip).
  csv: '>=6.0.0 <7.0.0'
  path_provider: '>=2.1.0 <3.0.0'
  # PDF generation + print/share. NOTE: the `pdf` package cannot do Arabic-script
  # OpenType shaping, so Urdu text is pre-shaped with arabic_reshaper before
  # rendering (see lib/printing/urdu_text.dart).
  pdf: '>=3.10.0 <4.0.0'
  printing: '>=5.12.0 <6.0.0'
  arabic_reshaper: '>=0.0.1 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/NotoNastaliqUrdu.ttf
    - assets/fonts/Amiri-Regular.ttf
    - assets/seed.json
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
