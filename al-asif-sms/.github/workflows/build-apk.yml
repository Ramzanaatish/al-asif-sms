name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-v2-${{ runner.os }}-${{ hashFiles('al-asif-sms/app/pubspec.yaml') }}
          restore-keys: pub-v2-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('al-asif-sms/app/android/gradle/wrapper/gradle-wrapper.properties', 'al-asif-sms/app/android/settings.gradle') }}
          restore-keys: gradle-v2-${{ runner.os }}-

      - name: Install dependencies
        working-directory: al-asif-sms/app
        run: flutter pub get

      - name: Analyze
        working-directory: al-asif-sms/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: al-asif-sms/app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alasif-apk
          path: al-asif-sms/app/build/app/outputs/flutter-apk/app-release.apk
